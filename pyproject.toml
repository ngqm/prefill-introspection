[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prefill-introspection"
version = "1.0.0"
description = "Code for the paper Can LLMs Reliably Self-Report Adversarial Prefills, and How?"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
license = { text = "MIT" }
authors = [
    { name = "Quang Minh Nguyen" },
    { name = "Uzair Ahmed" },
    { name = "Taegyoon Kim" },
]
keywords = ["llm", "introspection", "adversarial-prefill", "safety", "jailbreak", "interpretability"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
modal = ["modal"]

[project.urls]
Paper = "https://arxiv.org/abs/2606.23671"
Repository = "https://github.com/ngqm/prefill-introspection"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["core*", "llm*", "src*", "scripts*", "experiments*"]

[tool.ruff]
line-length = 100
target-version = "py310"
